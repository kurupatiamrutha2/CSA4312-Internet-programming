<!DOCTYPE html>
<html>
<head>
    <title>Bus Ticket Booking</title>
</head>

<body style="background-color: white ;">

<h2 style="color: black ;">BUS TICKET BOOKING</h2>

<form style="background-color: white; padding: 20px; width: 350px;">

    Name:
    <input type="text"><br><br>

    From:
    <input type="text"><br><br>

    To:
    <input type="text"><br><br>

    Date:
    <input type="date"><br><br>

    Number of Tickets:
    <input type="number"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    Seat Type:
    <input type="radio" name="seat"> Sleeper
    <input type="radio" name="seat"> Seater
    <br><br>

    Facilities:<br>
    <input type="checkbox"> AC
    <input type="checkbox"> Wi-Fi
    <input type="checkbox"> Water Bottle
    <br><br>

    <input type="submit" value="Book Ticket">

</form>

</body>
</html>
