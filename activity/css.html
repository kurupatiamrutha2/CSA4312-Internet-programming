
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
            font-size: 35px;
            font-family: Arial;
        }

        /* ID selector */
        #para1 {
            color: red;
            font-size: 25px;
            font-family: Georgia;
        }

        /* Class selector */
        .para2 {
            color: green;
            font-size: 20px;
            font-family: Verdana;
        }

        /* Universal selector */
        * {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Welcome to HTML</h1>

    <p id="para1">This is an ID selector.</p>

    <p class="para2">This is a class selector.</p>

    <p>This is a normal paragraph.</p>

</body>
</html>
